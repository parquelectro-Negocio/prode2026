<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
.app { max-width: 980px; margin: 0 auto; padding: 16px; }
h1 { text-align: center; font-size: 1.35rem; font-weight: 700; color: #fbbf24; margin-bottom: 2px; }
.subtitle { text-align: center; font-size: 0.76rem; color: #94a3b8; margin-bottom: 14px; }
.tabs { display: flex; gap: 6px; margin-bottom: 14px; justify-content: center; flex-wrap: wrap; }
.tab { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; transition: all .2s; }
.tab.active { background: #fbbf24; color: #0f172a; }
.tab:not(.active) { background: #1e293b; color: #94a3b8; }
.tab:not(.active):hover { background: #334155; color: #e2e8f0; }

#admin-overlay { position:fixed; inset:0; background:#0f172aee; z-index:100; display:flex; align-items:center; justify-content:center; }

.login-box p { color:#64748b; font-size:0.78rem; margin-bottom:16px; }
.login-input { background:#0f172a; border:1px solid #334155; border-radius:8px; padding:9px 12px; color:#e2e8f0; font-size:0.9rem; width:100%; margin-bottom:10px; }
.login-input:focus { outline:none; border-color:#fbbf24; }
.login-btn { background:#fbbf24; color:#0f172a; border:none; border-radius:8px; padding:9px 20px; font-weight:700; cursor:pointer; width:100%; font-size:0.88rem; }
.login-btn:hover { background:#f59e0b; }
.login-err { color:#f87171; font-size:0.75rem; margin-top:8px; display:none; }
.admin-badge { background:#4f46e5; color:#c7d2fe; border:none; border-radius:6px; padding:4px 10px; font-size:0.7rem; font-weight:700; cursor:pointer; margin-left:8px; }

.summary-stat .val { font-size:1.25rem; font-weight:800; color:#fbbf24; text-align:center; }

.standings { background:#1e293b; border-radius:12px; overflow:hidden; }
.standings-header { display:grid; grid-template-columns:38px 1fr 52px 52px 52px 52px 75px; gap:2px; padding:9px 12px; background:#0f172a; font-size:0.67rem; font-weight:700; color:#64748b; text-transform:uppercase; }

.standings-row:hover { background:#253346; }
.standings-row:last-child { border-bottom:none; }
.pos { color:#64748b; font-size:0.74rem; font-weight:700; text-align:center; }
.pos.gold { color:#fbbf24; }
.pos.silver { color:#94a3b8; }
.pos.bronze { color:#c97c3a; }
.name { font-weight:600; }
.cell { text-align:center; color:#cbd5e1; font-size:0.79rem; }
.pts { text-align:center; font-weight:800; color:#fbbf24; font-size:0.93rem; }

.section-title { font-size:0.7rem; font-weight:700; color:#64748b; text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }

.fecha-title { font-size:0.69rem; font-weight:700; color:#fbbf24; text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; padding:4px 9px; background:#1e293b; border-radius:6px; display:inline-block; }
.matches-grid { display:grid; gap:6px; }
.match-card { background:#1e293b; border-radius:9px; padding:9px 12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

.match-num { font-size:0.67rem; color:#64748b; font-weight:700; min-width:20px; }
.match-info { flex:1; min-width:170px; }
.match-teams { font-size:0.81rem; font-weight:600; color:#e2e8f0; }
.match-teams span { color:#64748b; margin:0 4px; font-size:0.7rem; }
.match-date { font-size:0.64rem; color:#64748b; margin-top:1px; }
.result-btns { display:flex; gap:4px; }
.result-btn { padding:5px 10px; border-radius:6px; border:none; cursor:pointer; font-size:0.7rem; font-weight:700; transition:all .15s; }
.result-btn.local { background:#1e3a5f; color:#60a5fa; }
.result-btn.empate { background:#2d2d1e; color:#fbbf24; }
.result-btn.visita { background:#3f1e1e; color:#f87171; }

.result-btn.active-empate { background:#d97706; color:#fff; box-shadow:0 0 7px #d9770677; }
.result-btn.active-visita { background:#dc2626; color:#fff; box-shadow:0 0 7px #dc262677; }
.match-status { font-size:0.67rem; color:#22c55e; font-weight:700; min-width:16px; text-align:right; }
.match-status.pending { color:#334155; }
.puesto-select { background:#1e1b4b; border:1px solid #3730a3; border-radius:6px; color:#e2e8f0; padding:5px 8px; font-size:0.76rem; cursor:pointer; flex:1; min-width:150px; }
.puesto-select:focus { outline:none; border-color:#6366f1; }

.picker-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:9px; flex-wrap:wrap; gap:5px; }
.picker-name { font-weight:700; color:#fbbf24; font-size:0.88rem; }
.picker-stats { font-size:0.69rem; color:#64748b; }
.picker-matches { display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:5px; }
.picker-match { font-size:0.72rem; background:#0f172a; border-radius:6px; padding:5px 8px; }
.picker-match.puesto-m { border:1px solid #3730a355; }

.pm-label { font-size:0.64rem; color:#6366f1; font-weight:700; margin-bottom:2px; }

.pm-pick.c2 { color:#f87171; }   /* visita */

function applyOverrides() {
  Object.keys(pickOverrides).forEach(function(pkey){
    if(!HARDCODED_PICKS[pkey]) HARDCODED_PICKS[pkey]={};

    });
  });
}

// Escuchar cambios en tiempo real desde Firebase
PRODE_REF.on('value', function(snap) {
  var data = snap.val() || {};
  if(data.results) {
    results = data.results;
    if(!results.puestos) results.puestos = {p1:null,p2:null,p3:null};
    if(!results.matches) results.matches = {};
  }
  if(data.pickOverrides) {
    pickOverrides = data.pickOverrides;
    applyOverrides();
  }
  if(!fbReady) {
    fbReady = true;
    renderStandings();
    return;
  }
  // Re-renderizar pestaña activa
  var tabs = ['standings','picks','admin'];
  var activo = document.querySelector('.tab.active');
  if(activo) {
    var t = tabs[Array.from(document.querySelectorAll('.tab')).indexOf(activo)];
    if(t==='standings') renderStandings();
    else if(t==='picks') renderPicks();
    else if(t==='admin' && isAdmin) renderAdmin();
  }
});

// ============================================================
// CALCULOS
// ============================================================
function calcScores() {
  return PARTICIPANTS.map(function(p) {
    var picks = HARDCODED_PICKS[p.key] || {};
    var ptsP=0, ptsF=0, acP=0, acF=0;
    MATCHES.forEach(function(m) {
      var r = results.matches[m.id];
      if(!r) return;
      if(picks[m.id] && picks[m.id]===r) { ptsP++; acP++; }
    });
    PUESTOS.forEach(function(pu) {
      var r = results.puestos[pu.id];
      if(!r) return;
      if(picks[pu.id] && picks[pu.id]===r) { ptsF+=5; acF++; }
    });
    return { key:p.key, name:p.name, pts:ptsP+ptsF, ptsP:ptsP, ptsF:ptsF, acP:acP, acF:acF };
  }).sort(function(a,b){ return b.pts-a.pts || b.ptsP-a.ptsP; });
}

// ============================================================
// TABS
// ============================================================
function showTab(tab) {
  ['standings','picks','admin'].forEach(function(t,i){
    document.querySelectorAll('.tab')[i].classList.toggle('active',t===tab);
    document.getElementById('tab-'+t).style.display=t===tab?'':'none';
  });
  if(tab==='standings') renderStandings();
  if(tab==='picks') renderPicks();
  if(tab==='admin') renderAdmin();
}

  var pct = Math.round((jug+pOk)/31*100);
  var html = '<div class="summary-banner">';
  html += '<div class="summary-stat"><div class="val">'+jug+'<span style="font-size:.75rem">/28</span></div><div class="lbl">Partidos</div></div>';
  html += '<div class="summary-stat"><div class="val">'+pOk+'<span style="font-size:.75rem">/3</span></div><div class="lbl">Puestos</div></div>';
  html += '<div class="summary-stat"><div class="val">'+(scores.length?scores[0].pts:0)+'</div><div class="lbl">Mejor puntaje</div></div>';
  html += '<div class="summary-stat"><div class="val">43</div><div class="lbl">Puntaje máx</div></div>';
  html += '</div>';
  html += '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>';
  html += '<div class="standings">';
  html += '<div class="standings-header"><div>#</div><div>Nombre</div><div style="text-align:center">PTS</div><div style="text-align:center">⚽</div><div style="text-align:center">🏆</div><div style="text-align:center">✓</div><div style="text-align:center">%</div></div>';
  scores.forEach(function(s,i){
    var medal=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
    var pc=i===0?'pos gold':i===1?'pos silver':i===2?'pos bronze':'pos';
    var totAc=s.acP+s.acF;
    var totJ=jug+pOk;
    var ef=totJ>0?Math.round(totAc/totJ*100)+'%':'-';
    html+='<div class="standings-row"><div class="'+pc+'">'+medal+'</div><div class="name">'+s.name+'</div><div class="pts">'+s.pts+'</div><div class="cell">'+s.ptsP+'</div><div class="cell" style="color:#a5b4fc">'+s.ptsF+'</div><div class="cell">'+totAc+'</div><div class="cell">'+ef+'</div></div>';
  });
  html += '</div>';
  document.getElementById('tab-standings').innerHTML=html;
}

// ============================================================
// PRONÓSTICOS (solo lectura)
// ============================================================
function pickLabel(pick, matchDef) {
  if(!pick) return {txt:'—',cls:'pend'};
  if(pick==='local') return {txt:'1 · '+matchDef.local, cls:'c1'};
  if(pick==='empate') return {txt:'X · Empate', cls:'cx'};
  if(pick==='visita') return {txt:'2 · '+matchDef.visita, cls:'c2'};
  return {txt:pick, cls:'cx'};
}
function renderPicks() {
  var html='<div class="picks-container">';
  var scores=calcScores();
  var scoreMap={};
  scores.forEach(function(s){scoreMap[s.key]=s;});
  PARTICIPANTS.forEach(function(p){
    var picks=HARDCODED_PICKS[p.key]||{};
    var sc=scoreMap[p.key];
    html+='<div class="picker-card">';
    html+='<div class="picker-header"><div class="picker-name">👤 '+p.name+'</div>';
    html+='<div class="picker-stats"><strong style="color:#fbbf24">'+sc.pts+' pts</strong> · '+sc.acP+' partidos + '+sc.acF+' puestos acertados</div></div>';
    html+='<div class="picker-matches">';
    MATCHES.forEach(function(m,i){
      var pick=picks[m.id]||'';
      var result=results.matches[m.id];
      var lbl=pickLabel(pick,m);
      var cls=lbl.cls;
      if(pick && result){cls=pick===result?'ok':'fail';}
      html+='<div class="picker-match"><div class="pm-teams">'+(i+1)+'. '+m.local+' vs '+m.visita+'</div>';
      html+='<div class="pm-pick '+cls+'">'+lbl.txt+'</div></div>';
    });
    PUESTOS.forEach(function(pu){
      var pick=picks[pu.id]||'';
      var result=results.puestos[pu.id];
      var cls='cx';
      if(pick && result){cls=pick===result?'ok':'fail';}
      else if(!pick){cls='pend';}
      html+='<div class="picker-match puesto-m"><div class="pm-label">'+pu.label+'</div>';
      html+='<div class="pm-pick '+cls+'">'+(pick||'—')+'</div></div>';
    });
    html+='</div></div>';
  });
  html+='</div>';
  document.getElementById('tab-picks').innerHTML=html;
}

// ============================================================
// ADMIN
// ============================================================
var adminSubtab = 'resultados'; // 'resultados' | 'pronos'
var editingPick = null; // key del participante que se está editando

function renderAdmin() {
  if(!isAdmin){document.getElementById('tab-admin').innerHTML='';return;}

  var html = '';
  // Subtabs
  html += '<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">';
  html += '<button class="subtab-btn '+(adminSubtab==='resultados'?'subtab-active':'')+'" onclick="switchAdminTab(\'resultados\')">📋 Cargar resultados</button>';
  html += '<button class="subtab-btn '+(adminSubtab==='pronos'?'subtab-active':'')+'" onclick="switchAdminTab(\'pronos\')">✏️ Editar pronósticos</button>';
  html += '<button class="btn-logout" style="margin-left:auto" onclick="logout()">Salir</button>';
  html += '</div>';

  if(adminSubtab==='resultados') {
    html += '<div class="info-note">Hacé click en <strong>1 / X / 2</strong> para cargar el resultado. Click de nuevo para desmarcarlo. La tabla se actualiza automáticamente.</div>';
    var curF='';
    MATCHES.forEach(function(m,i){
      var r=results.matches[m.id]||null;
      if(m.f!==curF){
        if(curF!=='')html+='</div></div>';
        curF=m.f;
        html+='<div class="fecha-block"><div class="fecha-title">'+m.f+'</div><div class="matches-grid">';
      }
      html+='<div class="match-card">';
      html+='<div class="match-num">'+(i+1)+'</div>';
      html+='<div class="match-info"><div class="match-teams">'+m.local+' <span>vs</span> '+m.visita+'</div><div class="match-date">'+m.date+'</div></div>';
      html+='<div class="result-btns">';
      html+='<button class="result-btn local '+(r==='local'?'active-local':'')+'" onclick="setResult(\''+m.id+'\',\'local\')">1</button>';
      html+='<button class="result-btn empate '+(r==='empate'?'active-empate':'')+'" onclick="setResult(\''+m.id+'\',\'empate\')">X</button>';
      html+='<button class="result-btn visita '+(r==='visita'?'active-visita':'')+'" onclick="setResult(\''+m.id+'\',\'visita\')">2</button>';
      html+='</div>';
      html+='<div class="match-status '+(r?'':'pending')+'">'+(r?'✓':'–')+'</div>';
      html+='</div>';
    });
    html+='</div></div>';
    // PUESTOS
    html+='<div class="fecha-block" style="margin-top:6px"><div class="fecha-title" style="color:#a5b4fc;background:#1e1b4b">🏆 Campeón y puestos — 5 puntos c/u</div><div class="matches-grid">';
    PUESTOS.forEach(function(pu){
      var res=results.puestos[pu.id]||'';
      html+='<div class="match-card puestos-card"><div class="match-info"><div class="match-teams">'+pu.label+'</div></div>';
      html+='<select class="puesto-select" onchange="setPuesto(\''+pu.id+'\',this.value)">';
      html+='<option value="">— Sin definir —</option>';
      SELECCIONES.forEach(function(s){html+='<option value="'+s+'" '+(res===s?'selected':'')+'>'+s+'</option>';});
      html+='</select>';
      html+='<div class="match-status '+(res?'':'pending')+'">'+(res?'✓':'–')+'</div>';
      html+='</div>';
    });
    html+='</div></div>';

  } else {
    // EDITAR PRONÓSTICOS
    html += '<div class="info-note">Seleccioná un participante para editar sus pronósticos. Los cambios se guardan en el momento.</div>';

    if(!editingPick) {
      // Lista de participantes para elegir
      html += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px">';
      PARTICIPANTS.forEach(function(p){
        html += '<button class="pick-edit-btn" onclick="startEditPick(\''+p.key+'\')">✏️ '+p.name+'</button>';
      });
      html += '</div>';
    } else {
      // Editor de un participante
      var p = PARTICIPANTS.filter(function(x){return x.key===editingPick;})[0];
      var picks = HARDCODED_PICKS[p.key] || {};
      html += '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">';
      html += '<button class="btn-logout" onclick="stopEditPick()">← Volver</button>';
      html += '<span style="font-weight:700;color:#fbbf24;font-size:0.95rem">✏️ '+p.name+'</span>';
      html += '</div>';

      // Partidos
      var curF2='';
      MATCHES.forEach(function(m,i){
        var pick=picks[m.id]||'';
        if(m.f!==curF2){
          if(curF2!=='')html+='</div></div>';
          curF2=m.f;
          html+='<div class="fecha-block"><div class="fecha-title">'+m.f+'</div><div class="matches-grid">';
        }
        html+='<div class="match-card">';
        html+='<div class="match-num">'+(i+1)+'</div>';
        html+='<div class="match-info"><div class="match-teams">'+m.local+' <span>vs</span> '+m.visita+'</div></div>';
        html+='<div class="result-btns">';
        html+='<button class="result-btn local '+(pick==='local'?'active-local':'')+'" onclick="setPickAdmin(\''+p.key+'\',\''+m.id+'\',\'local\')">1</button>';
        html+='<button class="result-btn empate '+(pick==='empate'?'active-empate':'')+'" onclick="setPickAdmin(\''+p.key+'\',\''+m.id+'\',\'empate\')">X</button>';
        html+='<button class="result-btn visita '+(pick==='visita'?'active-visita':'')+'" onclick="setPickAdmin(\''+p.key+'\',\''+m.id+'\',\'visita\')">2</button>';
        html+='</div>';
        html+='<div class="match-status '+(pick?'':'pending')+'">'+(pick?{local:'1',empate:'X',visita:'2'}[pick]:'–')+'</div>';
        html+='</div>';
      });
      html+='</div></div>';
      // Puestos del participante
      html+='<div class="fecha-block" style="margin-top:6px"><div class="fecha-title" style="color:#a5b4fc;background:#1e1b4b">🏆 Puestos elegidos</div><div class="matches-grid">';
      PUESTOS.forEach(function(pu){
        var pick=picks[pu.id]||'';
        html+='<div class="match-card puestos-card"><div class="match-info"><div class="match-teams">'+pu.label+'</div></div>';
        html+='<select class="puesto-select" onchange="setPuestoAdmin(\''+p.key+'\',\''+pu.id+'\',this.value)">';
        html+='<option value="">— No elegido —</option>';
        SELECCIONES.forEach(function(s){html+='<option value="'+s+'" '+(pick===s?'selected':'')+'>'+s+'</option>';});
        html+='</select>';
        html+='<div class="match-status '+(pick?'':'pending')+'">'+(pick?'✓':'–')+'</div>';
        html+='</div>';
      });
      html+='</div></div>';
    }
  }

  document.getElementById('tab-admin').innerHTML=html;
}

function switchAdminTab(t){ adminSubtab=t; editingPick=null; renderAdmin(); }
function startEditPick(key){ editingPick=key; renderAdmin(); }
function stopEditPick(){ editingPick=null; renderAdmin(); }

function setResult(id,val){
  results.matches[id]=results.matches[id]===val?null:val;
  saveResults();
  renderAdmin();
}
function setPuesto(id,val){
  results.puestos[id]=val||null;
  saveResults();
}
function setPickAdmin(pkey, matchId, val){
  if(!HARDCODED_PICKS[pkey]) HARDCODED_PICKS[pkey]={};
  var nuevo = HARDCODED_PICKS[pkey][matchId]===val ? null : val;
  if(nuevo) HARDCODED_PICKS[pkey][matchId]=nuevo;
  else delete HARDCODED_PICKS[pkey][matchId];
  // Guardar override
  if(!pickOverrides[pkey]) pickOverrides[pkey]={};
  if(nuevo) pickOverrides[pkey][matchId]=nuevo;
  else delete pickOverrides[pkey][matchId];
  savePickOverrides();
  renderAdmin();
}
function setPuestoAdmin(pkey, puestoId, val){
  if(!HARDCODED_PICKS[pkey]) HARDCODED_PICKS[pkey]={};
  if(val) HARDCODED_PICKS[pkey][puestoId]=val;
  else delete HARDCODED_PICKS[pkey][puestoId];
  if(!pickOverrides[pkey]) pickOverrides[pkey]={};
  if(val) pickOverrides[pkey][puestoId]=val;
  else delete pickOverrides[pkey][puestoId];
  savePickOverrides();
  renderAdmin();
}
